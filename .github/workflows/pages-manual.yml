name: Publish validated snapshot to Pages (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish selected data only, or refresh sources before publishing'
        required: true
        default: publish
        type: choice
        options: [publish, refresh]
      snapshot_run_id:
        description: 'Exact earlier run ID containing weather-snapshot (leave blank for Release input)'
        required: false
        type: string
      snapshot_retention_days:
        description: 'Explicit snapshot artifact retention (1..30 days); no permanent policy is assumed'
        required: true
        type: number
      snapshot_release:
        description: 'Exact Release tag containing the uploaded snapshot ZIP'
        required: false
        type: string
      snapshot_asset:
        description: 'Exact ZIP filename (no wildcard)'
        required: false
        type: string
      snapshot_sha256:
        description: 'Exact snapshot ZIP SHA-256 from pack output or earlier run summary'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-manual
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
      actions: read
    outputs:
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
      deploy: ${{ steps.snapshot.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r fetchers/requirements-dev.txt
      - name: Require default branch and validate exact input
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ inputs.mode }}
          SOURCE_RUN: ${{ inputs.snapshot_run_id }}
          RETENTION_DAYS: ${{ inputs.snapshot_retention_days }}
          RELEASE_TAG: ${{ inputs.snapshot_release }}
          ASSET_NAME: ${{ inputs.snapshot_asset }}
          ASSET_SHA: ${{ inputs.snapshot_sha256 }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          python -B fetchers/refresh_pages.py inputs
      - name: Validate origin of explicitly selected prior run
        if: inputs.snapshot_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.snapshot_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_METADATA: ${{ runner.temp }}/source-run.json
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUN_METADATA"
          python -B fetchers/refresh_pages.py source-run
      - name: Download snapshot from exact prior run
        if: inputs.snapshot_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: weather-snapshot
          path: ${{ runner.temp }}/pages-input
          run-id: ${{ inputs.snapshot_run_id }}
          github-token: ${{ github.token }}
      - name: Download explicitly selected Release asset
        if: inputs.snapshot_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.snapshot_release }}
          ASSET_NAME: ${{ inputs.snapshot_asset }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-input"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/pages-input"
          mv "$RUNNER_TEMP/pages-input/$ASSET_NAME" "$RUNNER_TEMP/pages-input/weather-snapshot.zip.tmp"
          mv "$RUNNER_TEMP/pages-input/weather-snapshot.zip.tmp" "$RUNNER_TEMP/pages-input/weather-snapshot.zip"
      - name: Validate selected snapshot and optionally refresh sources
        id: snapshot
        env:
          ASSET_SHA: ${{ inputs.snapshot_sha256 }}
          MODE: ${{ inputs.mode }}
          RETENTION_DAYS: ${{ inputs.snapshot_retention_days }}
          CWA_API_KEY: ${{ inputs.mode == 'refresh' && secrets.CWA_API_KEY || '' }}
          ARCHIVE: ${{ runner.temp }}/pages-input/weather-snapshot.zip
          WORK: ${{ runner.temp }}/pages-work
          RESULT: ${{ runner.temp }}/pages-input-result.json
        run: |
          python -B fetchers/refresh_pages.py prepare
          if [ -d "$WORK/site-data" ]; then
            rm -rf frontend/public/data
            mv "$WORK/site-data" frontend/public/data
          fi
      - name: Python tests
        if: steps.snapshot.outputs.deploy == 'true'
        run: python -B -m unittest discover -s fetchers/tests -v
      - name: Frontend tests
        if: steps.snapshot.outputs.deploy == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
      - name: Read Pages metadata
        if: steps.snapshot.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify static Pages routes
        if: steps.snapshot.outputs.deploy == 'true'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build:pages --prefix frontend
          python -B fetchers/verify_pages_build.py --data frontend/public/data --output frontend/dist --base "${PAGES_BASE_PATH%/}/" --manifest "$RUNNER_TEMP/pages-input-result.json"
      - name: Record selected code and data
        if: steps.snapshot.outputs.deploy == 'true'
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          ASSET_SHA: ${{ inputs.snapshot_sha256 }}
        run: |
          printf '\nCode: `%s`\n\nInput SHA-256: `%s`\n\nSnapshot recovery run: `%s` (artifact `weather-snapshot`)\n\n' "$GITHUB_SHA" "$ASSET_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"pages-input-result.json"))); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("Known incomplete histories: "+str(len(r["incomplete_history"]))+"\n")'
      - name: Preserve validated public snapshot before deployment
        if: steps.snapshot.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weather-snapshot
          path: ${{ runner.temp }}/pages-work/output/weather-snapshot.zip
          retention-days: ${{ inputs.snapshot_retention_days }}
          if-no-files-found: error
      - name: Upload validated website only
        if: steps.snapshot.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an older queued run after a newer successful run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        run: |
          newer=$(gh api --method GET --paginate "repos/$GH_REPO/actions/workflows/pages-manual.yml/runs?event=workflow_dispatch&per_page=100" --jq ".workflow_runs[] | select(.run_number > $CURRENT_RUN_NUMBER and .conclusion == \"success\") | .id")
          test -z "$newer"
      - name: Deploy successfully validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
