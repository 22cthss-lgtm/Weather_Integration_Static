# 臨時 workflow：Tropical Cyclone Center 來源可達性與 BUFR 套件安裝時間實測。
# 只在 feature/tropical-cyclone 分支、且本檔案有變更時觸發。跑完即刪除。
# 不寫入資料、不部署、不碰排程；只印出狀態碼、位元組數、耗時。
name: TC source probe (temporary)

on:
  push:
    branches: [feature/tropical-cyclone]
    paths: ['.github/workflows/tc-source-probe.yml']

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (compatible; weather-integration-static source verification)'
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
    steps:
      - name: Probe sources
        shell: bash
        run: |
          set -u
          # NOAA：取 8 小時前所屬的 cycle（本機實測延遲最長約 5.6 小時）
          N=$(date -u -d '8 hours ago' +%s); N=$(( N - N % 21600 ))
          ND=$(date -u -d "@$N" +%Y%m%d); NH=$(date -u -d "@$N" +%H)
          # ECMWF：取 10 小時前所屬的 cycle（本機實測延遲最長約 7.7 小時）
          E=$(date -u -d '10 hours ago' +%s); E=$(( E - E % 21600 ))
          ED=$(date -u -d "@$E" +%Y%m%d); EH=$(date -u -d "@$E" +%H)
          if [ "$EH" = "00" ] || [ "$EH" = "12" ]; then ES=360; else ES=144; fi
          NB=https://nomads.ncep.noaa.gov/pub/data/nccf/com
          EB=https://data.ecmwf.int/forecasts/$ED/${EH}z

          probe() {  # probe <標籤> <網址>；只輸出狀態碼、位元組數、耗時，不輸出本體與網址
            local label=$1 url=$2 out
            out=$(curl -sS -o /dev/null -A "$UA" --max-time 60 \
                  -w '%{http_code} | %{size_download} | %{time_total}' "$url" 2>/dev/null) || out="ERR(curl exit $?) | - | -"
            echo "| $label | $out |" | tee -a "$GITHUB_STEP_SUMMARY"
            sleep 1
          }

          {
            echo "## 來源可達性（runner: $(date -u +%FT%TZ)）"
            echo "NOAA cycle: $ND ${NH}Z；ECMWF cycle: $ED ${EH}Z（step ${ES}h）"
            echo
            echo "| 來源 | HTTP | bytes | 秒 |"
            echo "|---|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          probe "JTWC rss"            https://www.metoc.navy.mil/jtwc/rss/jtwc.rss
          probe "JTWC abpwweb.txt"    https://www.metoc.navy.mil/jtwc/products/abpwweb.txt
          probe "JTWC abpwsair.jpg"   https://www.metoc.navy.mil/jtwc/products/abpwsair.jpg
          probe "JMA extra.xml"       https://www.data.jma.go.jp/developer/xml/feed/extra.xml
          probe "JMA targetTc.json"   https://www.jma.go.jp/bosai/typhoon/data/targetTc.json
          probe "CWA W-C0034-005 (no key)" "https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0034-005?format=JSON"
          if [ -n "${CWA_API_KEY:-}" ]; then
            probe "CWA W-C0034-005 (key)" "https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0034-005?Authorization=${CWA_API_KEY}&format=JSON"
          else
            echo "| CWA W-C0034-005 (key) | secret 不可用，未測 | - | - |" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          probe "NOMADS ens_tracker 目錄" $NB/ens_tracker/prod/
          probe "NOMADS gfs tctrack 目錄" $NB/ens_tracker/prod/gfs.$ND/$NH/tctrack/
          probe "NOMADS gfs avno"        $NB/ens_tracker/prod/gfs.$ND/$NH/tctrack/avno.t${NH}z.cyclone.trackatcfunix
          probe "NOMADS gefs ac00"       $NB/ens_tracker/prod/gefs.$ND/$NH/tctrack/ac00.t${NH}z.cyclone.trackatcfunix
          probe "NOMADS aigfs agfs"      $NB/ens_tracker/prod/aigfs.$ND/$NH/tctrack/agfs.t${NH}z.cyclone.trackatcfunix
          probe "NOMADS aigefs a000"     $NB/ens_tracker/prod/aigefs.$ND/$NH/tctrack/a000.t${NH}z.cyclone.trackatcfunix
          probe "NOMADS tcvitals"        $NB/gfs/prod/gfs.$ND/$NH/atmos/gfs.t${NH}z.syndata.tcvitals.tm00
          probe "ECMWF ifs oper tf"      $EB/ifs/0p25/oper/${ED}${EH}0000-${ES}h-oper-tf.bufr
          probe "ECMWF ifs enfo tf"      $EB/ifs/0p25/enfo/${ED}${EH}0000-${ES}h-enfo-tf.bufr
          probe "ECMWF aifs-single tf"   $EB/aifs-single/0p25/oper/${ED}${EH}0000-360h-oper-tf.bufr
          probe "ECMWF aifs-ens tf"      $EB/aifs-ens/0p25/enfo/${ED}${EH}0000-360h-enfo-tf.bufr
          probe "UCAR bdecks_open 目錄"  https://hurricanes.ral.ucar.edu/repository/data/bdecks_open/

  bufr-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Time installs and decode one sample
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (compatible; weather-integration-static source verification)'
          timed() {  # timed <標籤> <指令...>；記錄秒數與結束碼
            local label=$1; shift
            local s=$(date +%s.%N) rc=0
            "$@" > /tmp/step.log 2>&1 || rc=$?
            local t=$(echo "$(date +%s.%N) - $s" | bc)
            echo "| $label | $rc | $t |" | tee -a "$GITHUB_STEP_SUMMARY"
            [ $rc -eq 0 ] || tail -20 /tmp/step.log
          }
          {
            echo "## BUFR 套件安裝時間（ubuntu-latest，Python $(python -V 2>&1 | cut -d' ' -f2)，--no-cache-dir）"
            echo
            echo "| 步驟 | 結束碼 | 秒 |"
            echo "|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          python -m venv /tmp/v-base && python -m venv /tmp/v-pbk && python -m venv /tmp/v-ecc
          timed "基準：現有 fetchers/requirements.txt" /tmp/v-base/bin/pip install --no-cache-dir -q -r fetchers/requirements.txt
          timed "pybufrkit + bitstring<4"             /tmp/v-pbk/bin/pip install --no-cache-dir -q pybufrkit 'bitstring<4'
          timed "eccodes"                             /tmp/v-ecc/bin/pip install --no-cache-dir -q eccodes

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { echo "[pybufrkit venv]"; /tmp/v-pbk/bin/pip list 2>/dev/null; du -sh /tmp/v-pbk
            echo "[eccodes venv]";   /tmp/v-ecc/bin/pip list 2>/dev/null; du -sh /tmp/v-ecc; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # 下載一個確定性 tf.bufr 樣本，放在獨立目錄，兩個套件各解一次
          E=$(date -u -d '10 hours ago' +%s); E=$(( E - E % 21600 ))
          ED=$(date -u -d "@$E" +%Y%m%d); EH=$(date -u -d "@$E" +%H)
          if [ "$EH" = "00" ] || [ "$EH" = "12" ]; then ES=360; else ES=144; fi
          mkdir -p /tmp/sample /tmp/scripts
          code=$(curl -sS -A "$UA" --max-time 60 -o /tmp/sample/det.bufr -w '%{http_code}' \
                 "https://data.ecmwf.int/forecasts/$ED/${EH}z/ifs/0p25/oper/${ED}${EH}0000-${ES}h-oper-tf.bufr" || echo ERR)
          echo "樣本下載：HTTP $code，$(stat -c %s /tmp/sample/det.bufr 2>/dev/null || echo 0) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "沒有樣本，略過解碼測試" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

          cat > /tmp/scripts/pbk.py <<'PY'
          import sys
          from pybufrkit.decoder import Decoder, generate_bufr_message
          from pybufrkit.dataquery import DataQuerent, NodePathParser
          q = DataQuerent(NodePathParser())
          ids = []
          for m in generate_bufr_message(Decoder(), open(sys.argv[1], 'rb').read()):
              v = q.query(m, '001025').get_values(0)[0]
              ids.append(v.decode().strip() if isinstance(v, bytes) else str(v))
          print('pybufrkit messages=%d ids=%s' % (len(ids), ' '.join(ids)))
          PY
          cat > /tmp/scripts/ecc.py <<'PY'
          import sys
          import eccodes as ec
          ids = []
          with open(sys.argv[1], 'rb') as f:
              while True:
                  h = ec.codes_bufr_new_from_file(f)
                  if h is None:
                      break
                  ec.codes_set(h, 'unpack', 1)
                  ids.append(ec.codes_get(h, 'stormIdentifier').strip())
                  ec.codes_release(h)
          print('eccodes %s messages=%d ids=%s' % (ec.codes_get_api_version(), len(ids), ' '.join(ids)))
          PY

          {
            echo
            echo "| 解碼 | 結束碼 | 秒 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          timed "pybufrkit 解碼" /tmp/v-pbk/bin/python -I /tmp/scripts/pbk.py /tmp/sample/det.bufr
          cat /tmp/step.log | tee -a "$GITHUB_STEP_SUMMARY"
          timed "eccodes 解碼"   /tmp/v-ecc/bin/python -I /tmp/scripts/ecc.py /tmp/sample/det.bufr
          cat /tmp/step.log | tee -a "$GITHUB_STEP_SUMMARY"
