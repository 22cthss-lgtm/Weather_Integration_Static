name: CI

# Code checks only: no secrets, no network fetches of weather data, no deploy.
# Publishing stays in pages-manual.yml (driven by weather-relay.yml).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep every commit on the default branch checked; supersede older runs elsewhere.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fetchers/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r fetchers/requirements-dev.txt
      - name: Run unit tests
        run: python -B -m unittest discover -s fetchers/tests -v

  frontend:
    name: Frontend tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build static Pages output
        run: npm run build:pages --prefix frontend
