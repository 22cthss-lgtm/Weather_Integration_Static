name: CI

# Code checks only: no secrets, no network fetches of weather data, no deploy.
# Publishing stays in pages-manual.yml (driven by weather-relay.yml).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep every commit on the default branch checked; supersede older runs elsewhere.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  lint:
    name: Lint (Python, frontend, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fetchers/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install linters
        run: |
          python -m pip install -r fetchers/requirements-ci.txt
          npm ci --prefix frontend
      - name: Ruff (fetchers/ruff.toml)
        run: ruff check fetchers --output-format github
      # Report every linter even when an earlier one fails.
      - name: ESLint (frontend/eslint.config.js)
        if: success() || failure()
        run: npm run lint --prefix frontend
      - name: actionlint (GitHub workflow files)
        if: success() || failure()
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # SC2016: backticks inside single-quoted printf formats in pages-manual.yml are literal Markdown.
          args: -color -ignore SC2016

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fetchers/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r fetchers/requirements-dev.txt
      - name: Run unit tests
        run: python -B -m unittest discover -s fetchers/tests -v

  frontend:
    name: Frontend tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build static Pages output
        run: npm run build:pages --prefix frontend

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fetchers/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: pip-audit (runtime Python dependencies)
        run: |
          python -m pip install -r fetchers/requirements-ci.txt
          pip-audit -r fetchers/requirements.txt
      # Gate on what ships in the website bundle; dev tooling advisories are handled by Dependabot PRs.
      - name: npm audit (production dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
