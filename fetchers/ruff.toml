# Lint policy for the Python fetchers (run in CI: `ruff check fetchers`).
# Bug-oriented rules only; formatting is not enforced by this file.
target-version = "py313"
line-length = 120

[lint]
select = [
  "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
  "F",               # pyflakes: unused/undefined names, unused imports
  "W",               # pycodestyle warnings
  "B",               # flake8-bugbear: likely bugs and design problems
]
ignore = [
  # Compact one-line statements are the project's established style.
  "E701", "E702", "E731",
  # Adding strict= would change runtime behaviour of parsers; lengths are fixed tables.
  "B905",
]

[lint.per-file-ignores]
# Test helpers define lambdas/closures that are called within the same loop iteration.
"tests/**" = ["B023"]
